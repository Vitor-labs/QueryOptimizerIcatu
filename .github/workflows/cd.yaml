name: Release

on:
  push:
    branches: [dev]

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # needed for tags

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install bump2version

      - name: Bump patch version
        id: bump # we’ll read new version out of the file next
        run: |
          bump2version patch
          # extract it from src/__version__.py
          VERSION=$(grep -Po '(?<=__version__ = ")[^"]+' src/__version__.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push commit & tag
        uses: ad-m/github-push-tag-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create ZIP artifact
        run: |
          ZIP_NAME="project-${{ steps.bump.outputs.version }}.zip"
          # exclude .git and workflows if you like:
          zip -r $ZIP_NAME . -x "*.git*" "*.github*" 
          echo "zip=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: peter-evans/create-release@v1
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          release_name: Release v${{ steps.bump.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Release
        uses: peter-evans/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.bump.outputs.zip }}
          asset_name: project-v${{ steps.bump.outputs.version }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
